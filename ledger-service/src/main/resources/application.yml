server:
  port: 8084

spring:
  application:
    name: ledger-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger_db}
    username: ${SPRING_DATASOURCE_USERNAME:bankflow}
    password: ${SPRING_DATASOURCE_PASSWORD:bankflow_secret}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# ── JWT ──────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}

# ── Internal service secret ───────────────────────────────────────
internal:
  service-secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}

# ── Actuator ──────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      service: ledger-service

# ── OpenAPI ───────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ── Logging (structured JSON) ─────────────────────────────────────
logging:
  pattern:
    console: >
      {"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}","level":"%level",
      "service":"ledger-service","correlationId":"%X{correlationId}",
      "logger":"%logger{36}","message":"%msg"}%n
  level:
    root: INFO
    com.bankflow: DEBUG
