name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      # Postgres — used by Testcontainers if not managed by TC itself;
      # Testcontainers starts its own containers so no external service needed.
      # Kafka and Redis are also managed by Testcontainers per-test.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build bankflow-common (required by all services)
        run: mvn -pl bankflow-common install -DskipTests -q

      - name: Build & test gateway
        run: mvn -pl bankflow-common,gateway -am verify -q

      - name: Build & test auth-service
        run: mvn -pl bankflow-common,auth-service -am verify -q
        env:
          # Testcontainers uses Docker — no env vars needed for DB/Kafka
          JWT_SECRET: test-secret-that-is-long-enough-for-hmac-sha256-minimum-256-bits
          INTERNAL_SERVICE_SECRET: test-internal-secret

      - name: Build & test account-service
        run: mvn -pl bankflow-common,account-service -am verify -q
        if: ${{ hashFiles('account-service/src/**') != '' }}
        env:
          JWT_SECRET: test-secret-that-is-long-enough-for-hmac-sha256-minimum-256-bits
          INTERNAL_SERVICE_SECRET: test-internal-secret

      - name: Build & test transaction-service
        run: mvn -pl bankflow-common,transaction-service -am verify -q
        if: ${{ hashFiles('transaction-service/src/**') != '' }}
        env:
          JWT_SECRET: test-secret-that-is-long-enough-for-hmac-sha256-minimum-256-bits
          INTERNAL_SERVICE_SECRET: test-internal-secret

      - name: Build & test ledger-service
        run: mvn -pl bankflow-common,ledger-service -am verify -q
        if: ${{ hashFiles('ledger-service/src/**') != '' }}
        env:
          JWT_SECRET: test-secret-that-is-long-enough-for-hmac-sha256-minimum-256-bits
          INTERNAL_SERVICE_SECRET: test-internal-secret

      - name: Build & test notification-service
        run: mvn -pl bankflow-common,notification-service -am verify -q
        if: ${{ hashFiles('notification-service/src/**') != '' }}

      - name: Build & test fraud-service
        run: mvn -pl bankflow-common,fraud-service -am verify -q
        if: ${{ hashFiles('fraud-service/src/**') != '' }}
        env:
          JWT_SECRET: test-secret-that-is-long-enough-for-hmac-sha256-minimum-256-bits

      - name: Build & test ai-assistant-service
        run: mvn -pl bankflow-common,ai-assistant-service -am verify -q
        if: ${{ hashFiles('ai-assistant-service/src/**') != '' }}
        env:
          JWT_SECRET: test-secret-that-is-long-enough-for-hmac-sha256-minimum-256-bits

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  # ── Docker build verification ────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: false
          tags: bankflow/gateway:ci

      - name: Build auth-service image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: auth-service/Dockerfile
          push: false
          tags: bankflow/auth-service:ci
